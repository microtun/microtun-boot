[package]
name = "microtun-boot-tools-esp"
description = "microtun boot ESP32-C3/C5 host tooling: ESP images, Secure Boot V2, partition tables, IDF boot chain"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["cli"]
# The `microtun-boot-tools-esp` binary.
cli = ["dep:clap", "microtun-boot-build/cli"]

[[bin]]
name = "microtun-boot-tools-esp"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
crc32fast = "1"
esp-idf-part = { workspace = true }
espflash = { workspace = true }
microtun-boot-layout-esp32c3-supermini = { workspace = true }
microtun-boot-layout-esp32c5-devkitc-1 = { workspace = true }
microtun-boot-build = { workspace = true, features = ["tools"] }
rsa = "0.10"
sha2 = { workspace = true, features = ["std", "oid"] }
serialport = { workspace = true }
tempfile = { workspace = true }
toml = "0.9"

[lints]
workspace = true
